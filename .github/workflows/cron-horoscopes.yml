name: Horoscope Generation

on:
  schedule:
    # GitHub deprioritises scheduled runs under queue load, and the top of the
    # hour is the most contended slot there is: at "0 10 * * *" this workflow
    # started between 3.4h and 11.2h late, every single day, never on time.
    # An off-peak minute plus an early hour keeps the run ahead of the
    # downstream 04:03 UTC feed pull even after a few hours of drift.
    # Daily at 02:23 UTC (10:23 PM ET previous day, during EDT)
    - cron: "23 2 * * *"
    # Weekly on Monday at 02:23 UTC
    - cron: "23 2 * * 1"
    # Monthly on 1st at 02:23 UTC
    - cron: "23 2 1 * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Horoscope type to generate"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly

jobs:
  determine-type:
    runs-on: ubuntu-latest
    outputs:
      horoscope_type: ${{ steps.type.outputs.type }}
    steps:
      - name: Determine horoscope type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          else
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" = "23 2 1 * *" ]; then
              echo "type=monthly" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "23 2 * * 1" ]; then
              echo "type=weekly" >> $GITHUB_OUTPUT
            else
              echo "type=daily" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Horoscope type: $(cat $GITHUB_OUTPUT)"

  generate:
    needs: determine-type
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        site: [psychicsource, pathforward]
        language: [en, es]
        sign:
          - Aries
          - Taurus
          - Gemini
          - Cancer
          - Leo
          - Virgo
          - Libra
          - Scorpio
          - Sagittarius
          - Capricorn
          - Aquarius
          - Pisces
        exclude:
          # pathforward has no Spanish horoscopes
          - site: pathforward
            language: es
    env:
      HOROSCOPE_TYPE: ${{ needs.determine-type.outputs.horoscope_type }}
      APP_URL: ${{ secrets.VERCEL_APP_URL }}
    steps:
      - name: Generate ${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) - ${{ needs.determine-type.outputs.horoscope_type }}
        run: |
          # Calls the generate-sign API with retries. The API skips entries that
          # already exist, so re-running is always safe. HTTP 400 means a config
          # problem (e.g. missing prompt), which retrying can't fix, so it only
          # warns. Anything else non-200 retries up to 3 times, and if it still
          # fails, the job goes red so the gap is visible.
          generate() {
            local GEN_TYPE="$1" DAYS_AHEAD="$2" LABEL="$3" ATTEMPT PAYLOAD HTTP_CODE
            if [ -n "$DAYS_AHEAD" ]; then
              PAYLOAD="{\"type\":\"$GEN_TYPE\",\"language\":\"${{ matrix.language }}\",\"sign\":\"${{ matrix.sign }}\",\"site\":\"${{ matrix.site }}\",\"daysAhead\":$DAYS_AHEAD}"
            else
              PAYLOAD="{\"type\":\"$GEN_TYPE\",\"language\":\"${{ matrix.language }}\",\"sign\":\"${{ matrix.sign }}\",\"site\":\"${{ matrix.site }}\"}"
            fi
            for ATTEMPT in 1 2 3; do
              HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 280 -L \
                -X POST "$APP_URL/api/horoscopes/generate-sign" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD") || HTTP_CODE="000"
              if [ "$HTTP_CODE" = "200" ]; then
                echo "  ✓ $LABEL"
                return 0
              fi
              if [ "$HTTP_CODE" = "400" ]; then
                echo "  ⚠ $LABEL skipped (HTTP 400, config issue): $(cat /tmp/response.json 2>/dev/null || true)"
                return 0
              fi
              echo "  ✗ $LABEL attempt $ATTEMPT/3 failed (HTTP $HTTP_CODE): $(cat /tmp/response.json 2>/dev/null || true)"
              if [ "$ATTEMPT" -lt 3 ]; then sleep 15; fi
            done
            return 1
          }

          echo "Type: $HOROSCOPE_TYPE"
          FAILURES=0

          if [ "$HOROSCOPE_TYPE" = "daily" ]; then
            for DAYS_AHEAD in 0 1 2 3 4 5; do
              generate daily "$DAYS_AHEAD" "${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) daily +${DAYS_AHEAD}d" || FAILURES=$((FAILURES+1))
              sleep 2
            done
            # Self-heal: backfill any weekly/monthly entry that a past run
            # failed to generate. No-op (skipped by the API) on healthy days.
            generate weekly "" "${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) weekly catchup" || FAILURES=$((FAILURES+1))
            generate monthly "" "${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) monthly catchup" || FAILURES=$((FAILURES+1))
            # Look one week ahead so a period never has to be created on the day
            # it starts. Downstream pulls at 00:03 ET used to race that morning's
            # run and 404 every Monday (new week) and every 1st (new month).
            # +7d always lands in next week, so next week's weekly is built a
            # week early; for monthly it is a no-op mid-month and builds next
            # month once we are inside the last 7 days of this one.
            generate weekly 7 "${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) weekly +7d lookahead" || FAILURES=$((FAILURES+1))
            generate monthly 7 "${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) monthly +7d lookahead" || FAILURES=$((FAILURES+1))
          else
            generate "$HOROSCOPE_TYPE" "" "${{ matrix.sign }} (${{ matrix.language }}/${{ matrix.site }}) $HOROSCOPE_TYPE" || FAILURES=$((FAILURES+1))
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "$FAILURES generation(s) still failing after retries"
            exit 1
          fi
